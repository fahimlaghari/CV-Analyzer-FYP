<!DOCTYPE html>
<html>
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark p-5">
    <div class="row bg-white mx-auto shadow" style="max-width:900px;">
        <div class="col-4 bg-success text-white p-5">
            <h3>{{ data.name }}</h3> <p>{{ data.email }}<br>{{ data.phone }}</p>
            <br><h5>Skills</h5><p>{{ data.skills }}</p>
        </div>
        <div class="col-8 p-5">
            <h3 class="text-success">Profile</h3><p>{{ data.summary }}</p>
            <h3 class="text-success">Work</h3><p><strong>{{ data.company }}</strong><br>{{ data.job_desc }}</p>
            <button onclick="window.print()" class="btn btn-outline-success mt-3">Download</button>
        </div>
    </div>
</body>
</html>
